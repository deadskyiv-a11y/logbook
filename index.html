<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Log" />
  <meta name="theme-color" content="#ffffff" />
  <title>Log</title>
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/favicon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="favicon/favicon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Resolve and apply the theme before first paint, so a dark load never flashes light.
    try {
      var pref = localStorage.getItem("log-theme") || "auto";
      var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
    window.addEventListener('error', function() {
      var root = document.getElementById('root');
      if (!root.hasChildNodes()) {
        root.innerHTML = '<p style="padding:40px;font-family:Georgia,serif;font-size:15px;color:#6e6e73">Something went wrong loading the app.<br>Please reload the page.</p>';
      }
    });
  </script>
  <style>
    /* ══════════════════════════  Design tokens  ══════════════════════════
       The ground is the only thing the theme switches. Post bands carry their
       own colour and text colour from the Pantone table in JS, injected as
       --band / --band-ink, so they look identical on white or on black.

       NOT tokenised, deliberately: optical corrections and layout constants
       tied to a specific glyph width. Those are not rhythm.
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: light dark;

      --ground: #ffffff;
      --ink: #0e0e10;
      --faint: #6e6e73;
      --rule: #e3e3e6;
      --quiet: #f2f2f3;
      --divider: #0e0e10;
      --divider-ink: #ffffff;
      --danger: #c0392b;
      --focus: #0e0e10;

      --font-prose: 'Instrument Serif', Georgia, serif;
      --font-ui: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      --t-micro: 10px;   /* uppercase ui labels */
      --t-meta: 11px;    /* fields, filter inputs */
      --t-time: 12px;
      --t-ui: 13px;      /* tabs, buttons */
      --t-sub: 14px;     /* looking-back entries */
      --t-body: 17px;    /* post prose */
      --t-write: 20px;   /* compose box */
      --t-title: 22px;   /* day headings, sign-in */
      --lh-tight: 1.3;
      --lh-body: 1.45;
      --lh-loose: 1.9;

      --s1: 4px;   --s2: 8px;   --s3: 12px;
      --s4: 16px;  --s5: 20px;  --s6: 24px;
      --s7: 32px;  --s8: 40px;  --s9: 64px;

      --measure: 640px;
      --rhythm-page: var(--s5);
    }
    /* Bright ground -> dark ground. Bands are untouched by this block. */
    :root[data-theme="dark"] {
      --ground: #0e0e10;
      --ink: #ffffff;
      --faint: #8a8a90;
      --rule: #26262a;
      --quiet: #1b1b1f;
      --divider: #ffffff;
      --divider-ink: #0e0e10;
      --danger: #ff6f61;
      --focus: #ffffff;
    }

    /* ─────────────────────────────  Base  ───────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: var(--ink); color: var(--ground); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    input:focus-visible, textarea:focus-visible { outline: none; }

    .wordmark {
      font-family: var(--font-prose); font-size: 19px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
    }
    .field {
      font-family: var(--font-ui); font-weight: 400;
      color: var(--ink); background: transparent;
      border: none; outline: none; width: 100%;
      border-bottom: 1px solid var(--rule);
      letter-spacing: 0.02em; transition: border-color 0.15s;
    }
    .field:focus { border-bottom-color: var(--ink); }
    .field::placeholder { color: var(--faint); }
    .micro-label {
      font-family: var(--font-ui); font-size: var(--t-micro); font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
    }
    .text-btn {
      font-family: var(--font-ui); font-size: var(--t-micro); font-weight: 400;
      letter-spacing: 0.04em; color: var(--faint);
      background: none; border: none; cursor: pointer; padding: 0;
      transition: color 0.15s;
    }
    .solid-btn {
      font-family: var(--font-ui); font-size: var(--t-ui); font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ground); background: var(--ink); border: none; cursor: pointer;
      padding: var(--s4) var(--s7); width: 100%; transition: opacity 0.15s;
    }
    .solid-btn:disabled { background: var(--rule); color: var(--faint); cursor: default; }
    .chip {
      font-family: var(--font-ui); font-size: var(--t-micro); font-weight: 400;
      letter-spacing: 0.04em; color: var(--ink); line-height: 1;
      background: var(--quiet); border: 1px solid var(--rule);
      padding: 6px 9px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 7px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .chip.on { color: var(--ground); background: var(--ink); border-color: var(--ink); }
    .chip-x { font-size: var(--t-time); line-height: 1; opacity: 0.55; }
    .chip-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

    /* ─────────────────────────────  Login  ───────────────────────────── */
    .login-wrap { min-height: 100vh; background: var(--ground); display: flex; flex-direction: column; }
    .login-header {
      border-bottom: 1px solid var(--rule);
      padding: calc(var(--s4) + env(safe-area-inset-top)) var(--rhythm-page) var(--s3);
    }
    .login-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--s8) var(--rhythm-page); }
    .login-card { width: 100%; max-width: 320px; }
    .login-title {
      font-family: var(--font-prose); font-size: var(--t-title);
      color: var(--ink); margin-bottom: var(--s7);
    }
    .login-field { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s6); }
    .login-input { font-size: var(--t-ui); padding: var(--s2) 0; }
    .login-input.readonly { color: var(--faint); cursor: default; }
    .login-btn { margin-top: var(--s1); }
    .login-error {
      font-family: var(--font-ui); font-size: var(--t-meta);
      color: var(--danger); margin-top: var(--s4);
    }
    .reset-link {
      margin-top: var(--s5); display: block; text-align: center; width: 100%;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .reset-link:disabled { opacity: 0.5; cursor: default; }
    .reset-sent {
      font-family: var(--font-prose); font-size: var(--t-sub);
      color: var(--faint); text-align: center; margin-top: var(--s5); line-height: var(--lh-loose);
    }

    /* ─────────────────────────────  Chrome  ───────────────────────────── */
    .app-wrap { min-height: 100vh; background: var(--ground); }
    .sticky-nav { position: sticky; top: 0; z-index: 10; background: var(--ground); }
    .header {
      border-bottom: 1px solid var(--rule);
      padding: calc(var(--s5) + env(safe-area-inset-top)) var(--rhythm-page) var(--s3);
    }
    .bar-inner {
      max-width: var(--measure); margin: 0 auto;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .header-right { display: flex; align-items: baseline; gap: var(--s3); }
    .live-clock {
      font-family: var(--font-ui); font-size: var(--t-meta);
      color: var(--faint); letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }
    .tab-bar { border-bottom: 1px solid var(--rule); padding: 0 var(--rhythm-page); }
    .tab-bar .bar-inner { align-items: center; justify-content: flex-start; }
    /* Four tabs plus Search is tight at 320px; let the row scroll rather than
       wrap or clip. */
    .tab-bar .bar-inner { overflow-x: auto; scrollbar-width: none; }
    .tab-bar .bar-inner::-webkit-scrollbar { display: none; }
    .tab {
      font-family: var(--font-ui); font-size: 10.5px; font-weight: 400;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint);
      padding: var(--s3) 0 11px; margin-right: 17px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      border: none; border-bottom: 2px solid transparent;
      background: none; transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
    .search-toggle {
      font-family: var(--font-ui); font-size: 10.5px; font-weight: 400;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint);
      padding: var(--s3) 0 11px; margin-left: auto; padding-left: var(--s3);
      white-space: nowrap; flex-shrink: 0;
      cursor: pointer; border: none; border-bottom: 2px solid transparent;
      background: none; transition: color 0.15s, border-color 0.15s;
      display: flex; align-items: center; gap: var(--s1);
    }
    .search-toggle.open { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
    /* Four tabs plus Search overflows a 320px screen at full size, which pushes
       Search out of sight. Tighten rather than let it scroll away. */
    @media (max-width: 360px) {
      .tab, .search-toggle { font-size: 9.5px; letter-spacing: 0.05em; }
      .tab { margin-right: 13px; }
      .header-right { gap: var(--s2); }
      :root { --rhythm-page: var(--s4); }
    }
    .search-pip { width: 5px; height: 5px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }

    /* ─────────────────────────────  Filters  ───────────────────────────── */
    .filter-panel {
      display: grid; grid-template-rows: 0fr; opacity: 0;
      border-bottom: 0 solid var(--rule);
      transition: grid-template-rows 0.38s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease, border-color 0.38s ease;
    }
    .filter-panel.open { grid-template-rows: 1fr; opacity: 1; border-bottom-width: 1px; }
    .filter-clip { overflow: hidden; min-height: 0; }
    .filter-panel-inner { padding: var(--s5) var(--rhythm-page) var(--s5); max-width: var(--measure); margin: 0 auto; }
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s6); margin-bottom: var(--s5); }
    .filter-row.full { grid-template-columns: 1fr; }
    .filter-field { display: flex; flex-direction: column; gap: var(--s2); }
    .filter-input { font-size: var(--t-meta); padding: var(--s1) 0 6px; }
    .filter-input[type="date"] { -webkit-appearance: none; appearance: none; }
    .filter-input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; }
    .filter-footer {
      display: flex; justify-content: space-between; align-items: center;
      gap: var(--s4); flex-wrap: wrap; margin-top: var(--s1);
      padding-top: var(--s4); border-top: 1px solid var(--rule);
    }
    .filter-summary {
      font-family: var(--font-ui); font-size: var(--t-micro);
      color: var(--faint); letter-spacing: 0.02em;
    }
    .filter-actions { display: flex; align-items: center; gap: var(--s3); margin-left: auto; }
    .accent-btn {
      font-family: var(--font-ui); font-size: var(--t-micro); font-weight: 500;
      letter-spacing: 0.04em; color: var(--danger);
      background: none; border: none; cursor: pointer; padding: 0;
      transition: opacity 0.15s;
    }
    .sep { color: var(--rule); font-size: var(--t-micro); }

    /* ─────────────────────────────  Compose  ───────────────────────────── */
    .write-panel {
      padding: var(--s6) var(--rhythm-page) calc(var(--s8) + env(safe-area-inset-bottom));
      max-width: var(--measure); margin: 0 auto;
    }
    .date-label {
      font-family: var(--font-ui); font-size: 9.5px; font-weight: 500;
      color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: var(--s4);
    }
    .textarea {
      width: 100%; font-family: var(--font-prose); font-size: var(--t-write); line-height: var(--lh-body);
      color: var(--ink); background: transparent; border: none; outline: none;
      resize: none; min-height: 180px; overflow: hidden;
      border-bottom: 1px solid var(--rule); padding-bottom: var(--s3); caret-color: var(--ink);
    }
    .textarea::placeholder { color: var(--faint); }
    .location-row { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); }
    .location-input { font-size: var(--t-meta); padding: var(--s1) 0 5px; }
    .loc-btn {
      font-family: var(--font-ui); font-size: var(--t-micro); font-weight: 500;
      color: var(--ink); background: none; border: none; cursor: pointer;
      letter-spacing: 0.04em; padding: 0; white-space: nowrap;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .tag-block { margin-top: var(--s5); margin-bottom: var(--s7); position: relative; }
    .tag-input { font-size: var(--t-meta); padding: var(--s1) 0 5px; margin-top: var(--s2); }
    .tag-suggest {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
      background: var(--ground); border: 1px solid var(--rule); border-top: none;
    }
    .tag-suggest button {
      display: block; width: 100%; text-align: left;
      font-family: var(--font-ui); font-size: var(--t-meta);
      color: var(--ink); background: none; border: none; cursor: pointer;
      padding: var(--s2) var(--s3); transition: background 0.12s;
    }
    .cancel-edit-btn { margin-top: var(--s3); display: block; text-align: center; width: 100%; }

    /* The compose screen is painted in the colour the post will keep, so what
       you write on is what you get. --band / --band-ink come from JS. */
    .write-band {
      background: var(--band, var(--ground));
      color: var(--band-ink, var(--ink));
      min-height: calc(100vh - 100px);
    }
    .write-band .date-row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: var(--s3); margin-bottom: var(--s4);
    }
    .write-band .date-label { color: inherit; opacity: 0.75; margin-bottom: 0; }
    .colour-note {
      font-family: var(--font-ui); font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7;
      white-space: nowrap;
    }
    .write-band .textarea,
    .write-band .field {
      color: inherit; caret-color: currentColor;
      border-bottom-color: color-mix(in srgb, currentColor 30%, transparent);
    }
    .write-band .textarea:focus,
    .write-band .field:focus { border-bottom-color: currentColor; }
    .write-band .textarea::placeholder,
    .write-band .field::placeholder { color: inherit; opacity: 0.5; }
    .write-band .micro-label { color: inherit; opacity: 0.7; }
    .write-band .loc-btn,
    .write-band .text-btn { color: inherit; }
    .write-band .chip { background: transparent; border-color: currentColor; color: inherit; }
    .write-band .solid-btn { background: var(--band-ink); color: var(--band); }
    .write-band .solid-btn:disabled { opacity: 0.45; }
    .write-band .tag-suggest { background: var(--band); border-color: currentColor; }
    .write-band .tag-suggest button { color: inherit; }
    @media (hover: hover) {
      .write-band .tag-suggest button:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
    }

    /* ─────────────────────────────  Log  ─────────────────────────────
       Posts are edge-to-edge colour bands with no gaps, so the ground is
       barely visible in the feed. --band / --band-ink come from JS. */
    .log-panel {
      max-width: var(--measure); margin: 0 auto;
      padding-bottom: calc(var(--s9) + env(safe-area-inset-bottom));
    }
    .day-header {
      background: var(--divider); color: var(--divider-ink);
      padding: var(--s4) var(--rhythm-page) var(--s3);
      display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3);
    }
    .day-title { font-family: var(--font-prose); font-size: var(--t-title); }
    .day-count {
      font-family: var(--font-ui); font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85;
    }
    .post {
      background: var(--band); color: var(--band-ink);
      padding: var(--s4) var(--rhythm-page) 17px;
    }
    .post.new { animation: fadeSlide 0.3s ease; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .post-time {
      font-family: var(--font-ui); font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.82;
      font-variant-numeric: tabular-nums;
    }
    .post-text {
      font-family: var(--font-prose); font-size: var(--t-body); line-height: var(--lh-body);
      white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 7px;
    }
    /* Inverted rather than a fixed highlight colour — guaranteed to read on
       every one of the 28 bands. */
    .post-text mark { background: currentColor; color: var(--band); padding: 0 2px; }
    .post-meta {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: var(--s1) var(--s3); margin-top: var(--s2);
      font-family: var(--font-ui); font-size: 9.5px; letter-spacing: 0.06em;
    }
    .post-loc { text-transform: uppercase; opacity: 0.82; }
    .post-tag {
      font: inherit; font-weight: 500; color: inherit; opacity: 0.85;
      background: none; border: none; padding: 0; cursor: pointer;
      transition: opacity 0.15s;
    }
    .post-actions { margin-left: auto; display: flex; padding-left: var(--s3); }
    .icon-btn {
      background: none; border: none; cursor: pointer; padding: 0;
      width: 38px; height: 38px; margin: -12px 0; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: inherit; opacity: 0.7; line-height: 1; transition: opacity 0.15s;
    }
    .edit-btn { font-size: var(--t-ui); }
    .delete-btn { font-size: 18px; }
    .delete-btn.confirming {
      font-family: var(--font-ui); font-size: 9.5px; font-weight: 500;
      letter-spacing: 0.04em; opacity: 1; width: auto; padding: 0 var(--s1);
    }
    .empty-state {
      padding: var(--s9) var(--rhythm-page); text-align: center; color: var(--faint);
      font-family: var(--font-prose); font-size: var(--t-body); line-height: var(--lh-loose);
    }

    /* ─────────────────────────────  Calendar  ─────────────────────────────
       Date numbers sit above the swatch rather than on it: cell colours are
       arbitrary, so no single number colour would stay legible on all of them. */
    .cal-panel {
      max-width: var(--measure); margin: 0 auto;
      padding: var(--s5) var(--rhythm-page) calc(var(--s9) + env(safe-area-inset-bottom));
    }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); }
    .cal-title { font-family: var(--font-prose); font-size: var(--t-title); }
    .cal-nav { display: flex; gap: var(--s1); }
    .cal-nav button {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid var(--rule); color: var(--ink);
      font-size: var(--t-ui); cursor: pointer; transition: border-color 0.15s;
    }
    .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s1); margin-bottom: var(--s2); }
    .cal-dow span {
      font-family: var(--font-ui); font-size: 8.5px; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); text-align: center;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--s1); }
    .cal-cell {
      background: none; border: none; padding: 0; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; align-items: stretch;
    }
    .cal-cell:disabled, .cal-cell.empty { cursor: default; }
    .cal-num { font-family: var(--font-ui); font-size: 10px; color: var(--faint); text-align: center; }
    .cal-cell.today .cal-num, .cal-cell.selected .cal-num { color: var(--ink); font-weight: 500; }
    .cal-swatch {
      height: 28px; display: flex; flex-direction: column;
      border: 1px solid var(--rule); overflow: hidden;
    }
    .cal-cell.has .cal-swatch { border-color: transparent; }
    .cal-cell.selected .cal-swatch { outline: 2px solid var(--ink); outline-offset: 1px; }
    .cal-cell.today .cal-swatch { border-color: var(--ink); }
    .cal-stripe { flex: 1 1 0; min-height: 0; }
    .cal-foot {
      margin-top: var(--s5); font-family: var(--font-ui); font-size: 9.5px;
      color: var(--faint); letter-spacing: 0.04em;
      display: flex; justify-content: space-between; gap: var(--s3);
    }

    /* ─────────────────────────────  Looking back  ───────────────────────────── */
    .lookback { background: var(--quiet); }
    .lookback-toggle {

    function lookingBack(entries, now) {
      const day = now.getDate();
      const buckets = new Map();
      entries.forEach(entry => {
        const d = new Date(entry.timestamp);
        if (d.getDate() !== day) return;
        const monthsAgo = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
        if (monthsAgo <= 0) return;

        buckets.get(monthsAgo).push(entry);

      return Array.from(buckets.entries())
        .sort((a, b) => a[0] - b[0])

    // Monday-first, padded to whole weeks with nulls. Kept pure so the leading
    // blanks and month lengths are assertable.
    function monthGrid(year, month) {
      const lead = (new Date(year, month, 1).getDay() + 6) % 7;
      const days = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(null);
      for (let d = 1; d <= days; d++) cells.push(new Date(year, month, d));
      while (cells.length % 7) cells.push(null);
      return cells;
    }

    // Chronological within each day, so a cell's stripes run in the order the
    // entries were written rather than the feed's newest-first order.
    function entriesByDay(entries) {
      const map = new Map();
      entries.forEach(entry => {
        const key = new Date(entry.timestamp).toDateString();
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(entry);
      });
      map.forEach(list => list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)));
      return map;
    }

    function addMonths(date, n) {
      return new Date(date.getFullYear(), date.getMonth() + n, 1);
    }

    function formatMonth(date) {
      return date.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    }

    function isoDay(date) {
      const pad = n => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }

    // Returns [from, to] as yyyy-mm-dd, feeding the existing date filter state.
    function presetRange(kind, now) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (kind === "today") return [isoDay(today), isoDay(today)];
      if (kind === "week") {
        const start = new Date(today);
        start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // week starts Monday
        return [isoDay(start), isoDay(today)];
      }
      if (kind === "month") return [isoDay(new Date(now.getFullYear(), now.getMonth(), 1)), isoDay(today)];
      if (kind === "year") return [isoDay(new Date(now.getFullYear(), 0, 1)), isoDay(today)];
      return ["", ""];
    }

    // Splits text into plain strings and { match } objects. Deliberately NOT
    // building an HTML string: entry text is user prose and may contain "<".
    function highlightParts(text, query) {
      const q = String(query || "").trim();
      if (!q) return [text];
      const haystack = text.toLowerCase();
      const needle = q.toLowerCase();
      const parts = [];
      let i = 0;
      while (i <= text.length) {
        const at = haystack.indexOf(needle, i);
        if (at === -1) { if (i < text.length) parts.push(text.slice(i)); break; }
        if (at > i) parts.push(text.slice(i, at));
        parts.push({ match: text.slice(at, at + q.length) });
        i = at + q.length;
      }
      return parts;
    }

    function toMarkdown(entries) {
      const grouped = groupByDate(entries);
      const days = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
      const out = ["# Log", ""];
      days.forEach(key => {
        out.push("## " + formatDate(new Date(key)), "");
        // Chronological within a day — an exported journal reads forwards.
        grouped[key].slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).forEach(entry => {
          out.push("**" + formatTime(new Date(entry.timestamp)) + "**", "");
          out.push(entry.text.trim(), "");

          if (entry.location) meta.push(entry.location);
          if (entry.tags && entry.tags.length) meta.push(entry.tags.map(t => "#" + t).join(" "));
          if (meta.length) out.push("_" + meta.join(" · ") + "_", "");

    /* ───────────────────────  Post colour  ───────────────────────

       reached AA. Names are Pantone trademarks; only the hex values matter here.
       ────────────────────────────────────────────────────────────── */
    const BAND_CREAM = "#fff0d6";
    const BAND_INK = "#0e0e10";
    const PANTONE = [
      ["Cerulean", "#9bb7d4", BAND_INK],
      ["Fuchsia Rose", "#bd406f", BAND_CREAM],   // 5% darker than #c74375
      ["True Red", "#bf1932", BAND_CREAM],
      ["Aqua Sky", "#7bc4c4", BAND_INK],

      ["Blue Turquoise", "#53b0ae", BAND_INK],

      ["Chili Pepper", "#9b1b30", BAND_CREAM],
      ["Blue Iris", "#5a5b9f", BAND_CREAM],
      ["Mimosa", "#f0c05a", BAND_INK],
      ["Turquoise", "#45b5aa", BAND_INK],
      ["Honeysuckle", "#d94f70", BAND_INK],
      ["Tangerine Tango", "#c73a20", BAND_CREAM], // 10% darker than #dd4124
      ["Emerald", "#009874", BAND_INK],

    // The colour is hashed from the id, so the id has to exist before the row
    // does — otherwise the compose screen has nothing to hash and the colour
    // would only appear after saving.
    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;

      });

    function hashSeed(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    const MIN_HUE_GAP = 40;   // degrees between neighbouring bands

    // Hue and saturation of a band, used only to stop two *different* Pantone
    // reds landing next to each other — index de-duplication alone doesn't
    // catch that, and a run of near-identical bands reads as a bug.
    function hueSat(hex) {
      const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      if (d === 0) return { h: 0, s: 0 };
      let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return { h: ((h * 60) + 360) % 360, s: d / mx };
    }
    const HUE_SAT = PANTONE.map(([, bg]) => hueSat(bg));
    function hueGap(a, b) { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); }

    // Colour is hashed from the entry id, so a post keeps it forever. Two guards
    // then nudge the index forward: the same colour must not recur within
    // NO_REPEAT_WITHIN posts, and a neighbour must not sit within MIN_HUE_GAP
    // degrees. Near-greys are exempt from the hue rule — they clash with nothing.
    function assignPostColours(orderedEntries) {
      const map = new Map();
      const recent = [];
      let prev = null;
      orderedEntries.forEach(entry => {
        const start = hashSeed(String(entry.id)) % PANTONE.length;
        let idx = start;
        for (let step = 0; step < PANTONE.length; step++) {
          const cand = (start + step) % PANTONE.length;
          if (recent.includes(cand)) continue;
          const hs = HUE_SAT[cand];
          const clashes = prev && prev.s > 0.15 && hs.s > 0.15 && hueGap(hs.h, prev.h) < MIN_HUE_GAP;
          if (clashes) continue;
          idx = cand;
          break;

        map.set(entry.id, { name, bg, ink });
        prev = HUE_SAT[idx];
        recent.push(idx);
        if (recent.length > NO_REPEAT_WITHIN) recent.shift();
      });
      return map;
    }

    function relLum(hex) {
      const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)

      const x = relLum(a), y = relLum(b);

    function runSelfTest() {

      ok("normalizeTag strips # and cases", normalizeTag("  #Work Trip ") === "work trip");
      ok("parseTags splits and drops empties", JSON.stringify(parseTags("a, ,B")) === '["a","b"]');
      ok("mergeTags dedupes", JSON.stringify(mergeTags(["a"], "A, c")) === '["a","c"]');

        { timestamp: new Date(2026, 7, 4, 9, 0).toISOString(), text: "morning", location: "Accra", tags: ["work"] },
        { timestamp: new Date(2026, 7, 4, 8, 0).toISOString(), text: "earlier", location: "", tags: [] },
      ]);

      ok("markdown carries meta", md.indexOf("_Accra · #work_") !== -1);

      // Every Pantone pair must clear AA for body text — this is the check that
      // fails loudly if a colour is ever added or edited without re-verifying.
      const bad = PANTONE.filter(([n, bg, ink]) => contrast(bg, ink) < 4.5);
      ok("all " + PANTONE.length + " pantone pairs >= 4.5:1", bad.length === 0);
      ok("pantone table is 28 colours", PANTONE.length === 28);

      const mk = id => ({ id });
      const many = Array.from({ length: 40 }, (_, i) => mk("entry-" + i));
      const assigned = assignPostColours(many);
      ok("every post gets a colour", assigned.size === 40);
      const seq = many.map(e => assigned.get(e.id).bg);
      let clash = false;
      for (let i = 0; i < seq.length; i++)
        for (let j = Math.max(0, i - NO_REPEAT_WITHIN); j < i; j++)
          if (seq[i] === seq[j]) clash = true;
      ok("no colour repeats within " + NO_REPEAT_WITHIN + " posts", !clash);
      let tooClose = 0;
      for (let i = 1; i < seq.length; i++) {
        const a = hueSat(seq[i]), b = hueSat(seq[i - 1]);
        if (a.s > 0.15 && b.s > 0.15 && hueGap(a.h, b.h) < MIN_HUE_GAP) tooClose++;
      }
      ok("no two neighbouring bands share a hue family", tooClose === 0);
      // The point of minting the id before insert: the colour shown while
      // composing must be the colour the saved post keeps.
      const existing = Array.from({ length: 9 }, (_, i) => mk("old-" + i));
      const draft = mk("draft-1");
      const previewed = assignPostColours([draft, ...existing]).get(draft.id).bg;
      const afterSave = assignPostColours([draft, ...existing]).get(draft.id).bg;
      ok("compose preview survives saving", previewed === afterSave);
      ok("draft colour respects its neighbour",
        previewed !== assignPostColours([draft, ...existing]).get(existing[0].id).bg);
      // August 2026 starts on a Saturday, so Monday-first needs five blanks.
      const aug = monthGrid(2026, 7);
      ok("monthGrid pads to whole weeks", aug.length % 7 === 0);
      ok("monthGrid leads with 5 blanks for Aug 2026", aug.slice(0, 5).every(c => c === null) && aug[5] !== null);
      ok("monthGrid first cell is the 1st", aug[5].getDate() === 1);
      ok("monthGrid has 31 days", aug.filter(Boolean).length === 31);
      const feb = monthGrid(2024, 1);
      ok("monthGrid handles a leap February", feb.filter(Boolean).length === 29);

      const dayed = entriesByDay([
        { id: "b", timestamp: new Date(2026, 7, 4, 18, 0).toISOString() },
        { id: "a", timestamp: new Date(2026, 7, 4, 6, 0).toISOString() },
        { id: "c", timestamp: new Date(2026, 7, 5, 9, 0).toISOString() },
      ]);
      ok("entriesByDay buckets by day", dayed.size === 2);
      ok("entriesByDay sorts a day chronologically",
        dayed.get(new Date(2026, 7, 4).toDateString()).map(e => e.id).join("") === "ab");

      ok("addMonths crosses a year boundary",
        addMonths(new Date(2026, 11, 1), 1).getFullYear() === 2027);

      ok("newId returns distinct ids", newId() !== newId());
      ok("newId looks like a uuid", /^[0-9a-f-]{36}$/.test(newId()));

      ok("colour is stable for the same id",
        assignPostColours([mk("abc")]).get("abc").bg === assignPostColours([mk("abc")]).get("abc").bg);

      if (fails.length) console.error("SELFTEST FAILED (" + fails.length + "):", fails);
      else console.log("SELFTEST PASSED");
      return fails;
    }
    if (new URLSearchParams(window.location.search).has("selftest")) runSelfTest();

    /* ─────────────────────────  Components  ───────────────────────── */

    // Holds the *preference* (auto/light/dark) but writes the resolved theme to
    // data-theme, so the stylesheet only ever needs one dark block. Re-resolves
    // when the system flips while the preference is "auto".
    function useTheme() {
      const [theme, setTheme] = useState(() => store.get("log-theme") || "auto");
      useEffect(() => {
        store.set("log-theme", theme);
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          const dark = theme === "dark" || (theme === "auto" && mq.matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? DARK_GROUND : LIGHT_GROUND);
        };
        apply();
        mq.addEventListener("change", apply);
        return () => mq.removeEventListener("change", apply);
      }, [theme]);
      const cycle = () => setTheme(t => (t === "auto" ? "light" : t === "light" ? "dark" : "auto"));
      return [theme, cycle];
    }

    function TagInput({ tags, setTags, suggestions }) {
      const [draft, setDraft] = useState("");
      const normalized = normalizeTag(draft);
      const matches = normalized
        ? suggestions.filter(t => t.includes(normalized) && !tags.includes(t)).slice(0, 6)
        : [];

      function commit(raw) {
        setTags(mergeTags(tags, raw));
        setDraft("");
      }

      function onKeyDown(e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          if (draft.trim()) commit(draft);
        } else if (e.key === "Backspace" && !draft && tags.length) {
          setTags(tags.slice(0, -1));
        }
      }

      return (
        <div className="tag-block">
          <span className="micro-label">Tags</span>
          {tags.length > 0 && (
            <div className="chip-row" style={{ marginTop: 10 }}>
              {tags.map(tag => (
                <button
                  key={tag}
                  type="button"
                  className="chip"
                  onClick={() => setTags(tags.filter(t => t !== tag))}
                  title={"Remove " + tag}
                >
                  {tag}<span className="chip-x">×</span>
                </button>
              ))}
            </div>
          )}
          <input
            className="field tag-input"
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onKeyDown={onKeyDown}
            onBlur={() => { if (draft.trim()) commit(draft); }}
            placeholder="Add a tag, press enter"
          />
          {matches.length > 0 && (
            <div className="tag-suggest">
              {matches.map(tag => (
                <button key={tag} type="button" onMouseDown={e => { e.preventDefault(); commit(tag); }}>
                  {tag}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    function LoginScreen() {
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [resetSent, setResetSent] = useState(false);
      const [resetting, setResetting] = useState(false);

      async function signIn(e) {
        e.preventDefault();
        if (!password) return;
        setLoading(true);
        setError("");
        const { error } = await db.auth.signInWithPassword({ email: OWNER_EMAIL, password });
        if (error) {
          setError("Incorrect password. Use 'Forgot password' below to set one.");
          setLoading(false);
        }
      }

      async function resetPassword() {
        setResetting(true);
        await db.auth.resetPasswordForEmail(OWNER_EMAIL, {
          redirectTo: window.location.origin + "?reset=true",
        });
        setResetSent(true);
        setResetting(false);
      }

      return (
        <div className="login-wrap">
          {/* No .bar-inner here — the sign-in card centres on the viewport, not
              on the log's content column, so a 640px header would sit off-axis. */}
          <div className="login-header"><span className="wordmark">Log</span></div>
          <div className="login-body">
            <form className="login-card" onSubmit={signIn}>
              <div className="login-title">Sign in</div>
              <div className="login-field">
                <span className="micro-label">Email</span>
                <input className="field login-input readonly" type="email" value={OWNER_EMAIL} readOnly />
              </div>
              <div className="login-field">
                <span className="micro-label">Password</span>
                <input
                  className="field login-input"
                  type="password"
                  placeholder="••••••••"
                  value={password}
                  onChange={e => { setPassword(e.target.value); setError(""); }}
                  autoFocus
                />
              </div>
              <button className="solid-btn login-btn" type="submit" disabled={!password || loading}>
                {loading ? "Signing in..." : "Sign in"}
              </button>
              {error && <div className="login-error">{error}</div>}
              {resetSent ? (
                <div className="reset-sent">Password reset email sent.<br />Check your inbox.</div>
              ) : (
                <button type="button" className="text-btn reset-link" onClick={resetPassword} disabled={resetting}>
                  {resetting ? "Sending..." : "Forgot password?"}
                </button>
              )}
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [entries, setEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [text, setText] = useState("");
      const [location, setLocation] = useState("");
      const [tags, setTags] = useState([]);
      const [locLoading, setLocLoading] = useState(false);
      const [now, setNow] = useState(new Date());
      const [justAdded, setJustAdded] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [view, setView] = useState("log");
      const [editingEntry, setEditingEntry] = useState(null);
      const [filterOpen, setFilterOpen] = useState(false);
      const [filterText, setFilterText] = useState("");
      const [filterLocation, setFilterLocation] = useState("");
      const [filterTags, setFilterTags] = useState([]);
      const [filterDateFrom, setFilterDateFrom] = useState("");
      const [filterDateTo, setFilterDateTo] = useState("");
      const [lookbackOpen, setLookbackOpen] = useState(false);
      const [draftId, setDraftId] = useState(null);
      const [calMonth, setCalMonth] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
      const touchX = useRef(null);
      const [theme, cycleTheme] = useTheme();
      const textRef = useRef(null);
      const confirmTimer = useRef(null);

      const hasActiveFilters = !!(filterText || filterLocation || filterTags.length || filterDateFrom || filterDateTo);

      const filteredEntries = entries.filter(entry => {
        if (filterText && !entry.text.toLowerCase().includes(filterText.toLowerCase())) return false;
        if (filterLocation && !(entry.location || "").toLowerCase().includes(filterLocation.toLowerCase())) return false;
        if (filterTags.length && !filterTags.every(t => (entry.tags || []).includes(t))) return false;
        if (filterDateFrom) {
          const from = new Date(filterDateFrom); from.setHours(0, 0, 0, 0);
          if (new Date(entry.timestamp) < from) return false;
        }
        if (filterDateTo) {
          const to = new Date(filterDateTo); to.setHours(23, 59, 59, 999);
          if (new Date(entry.timestamp) > to) return false;
        }
        return true;
      });

      // Derived from the entries already in hand — no second table, no extra query.
      const allTags = useMemo(() => {
        const set = new Set();
        entries.forEach(e => (e.tags || []).forEach(t => set.add(t)));
        return Array.from(set).sort();
      }, [entries]);

      // Assigned over every entry, not the filtered view: a post's colour must
      // not change when you search. It also makes the compose preview exact,
      // since the draft sits at the head of this same list.
      const postColours = useMemo(() => assignPostColours(entries), [entries]);

      // Prepending the draft reproduces exactly what it will be assigned once
      // saved — same list, same neighbours, same guards.
      const draftColour = useMemo(() => {
        if (!draftId) return null;
        return assignPostColours([{ id: draftId }, ...entries]).get(draftId);
      }, [draftId, entries]);

      const composeColour = editingEntry ? postColours.get(editingEntry.id) : draftColour;

      // Calendar reads the same unfiltered list and the same colour map as the
      // feed, so a day's stripes always match the posts behind them.
      const byDay = useMemo(() => entriesByDay(entries), [entries]);
      const calCells = useMemo(
        () => monthGrid(calMonth.getFullYear(), calMonth.getMonth()),
        [calMonth.getFullYear(), calMonth.getMonth()]
      );
      const calMonthCount = calCells.reduce(
        (n, d) => n + (d ? (byDay.get(d.toDateString()) || []).length : 0), 0);

      function openDay(date) {
        const iso = isoDay(date);
        setFilterDateFrom(iso); setFilterDateTo(iso);
        setFilterText(""); setFilterLocation(""); setFilterTags([]);
        setView("log");
      }
      function onCalTouchStart(e) { touchX.current = e.changedTouches[0].clientX; }
      function onCalTouchEnd(e) {
        if (touchX.current === null) return;
        const dx = e.changedTouches[0].clientX - touchX.current;
        touchX.current = null;
        if (Math.abs(dx) > 50) setCalMonth(m => addMonths(m, dx < 0 ? 1 : -1));
      }

      const lookBack = useMemo(() => lookingBack(entries, now), [entries, now.toDateString()]);
      const lookBackCount = lookBack.reduce((n, g) => n + g.entries.length, 0);

      const activePreset = ["today", "week", "month", "year"].find(kind => {
        const [from, to] = presetRange(kind, now);
        return filterDateFrom === from && filterDateTo === to;
      });

      function applyPreset(kind) {
        if (activePreset === kind) { setFilterDateFrom(""); setFilterDateTo(""); return; }
        const [from, to] = presetRange(kind, now);
        setFilterDateFrom(from); setFilterDateTo(to);
      }

      function clearFilters() {
        setFilterText(""); setFilterLocation(""); setFilterTags([]);
        setFilterDateFrom(""); setFilterDateTo("");
      }

      function toggleFilterTag(tag) {
        setFilterTags(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]);
      }

      function exportEntries(format) {
        const stamp = isoDay(new Date());
        if (format === "json") {
          download("log-" + stamp + ".json", "application/json", JSON.stringify(filteredEntries, null, 2));
        } else {
          download("log-" + stamp + ".md", "text/markdown", toMarkdown(filteredEntries));
        }
      }

      useEffect(() => {
        db.auth.getSession().then(({ data: { session } }) => {
          if (session && session.user.email !== OWNER_EMAIL) {
            db.auth.signOut(); setSession(null);
          } else { setSession(session); }
          setAuthLoading(false);
        });
        const { data: { subscription } } = db.auth.onAuthStateChange((_event, session) => {
          if (session && session.user.email !== OWNER_EMAIL) {
            db.auth.signOut(); setSession(null);
          } else { setSession(session); }
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        if (!session) return;
        async function fetchEntries() {
          const { data, error } = await db.from("entries").select("*").order("timestamp", { ascending: false });
          if (!error) setEntries(data || []);
          setLoading(false);
        }
        fetchEntries();
      }, [session]);

      // Grow the compose box to its content instead of scrolling inside a fixed height.
      useEffect(() => {
        const el = textRef.current;
        if (!el || view !== "write") return;
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }, [text, view]);

      useEffect(() => () => clearTimeout(confirmTimer.current), []);

      function getLocation() {
        if (!navigator.geolocation) { setLocation("Geolocation not supported"); return; }
        setLocLoading(true);
        navigator.geolocation.getCurrentPosition(
          async pos => {
            const { latitude, longitude } = pos.coords;
            try {
              const res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`,
                { headers: { "Accept-Language": "en" } }
              );
              const data = await res.json();
              const addr = data.address;
              const place = addr.suburb || addr.neighbourhood || addr.quarter || addr.city_district || addr.city || addr.town || addr.village || "";
              const city = addr.city || addr.town || addr.county || "";
              setLocation(place && city && place !== city ? `${place}, ${city}` : place || city || `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`);
            } catch { setLocation(`${latitude.toFixed(3)}, ${longitude.toFixed(3)}`); }
            setLocLoading(false);
          },
          err => {
            setLocation(err.code === 1 ? "Location access denied" : "Could not get location");
            setLocLoading(false);
          },
          { timeout: 10000, maximumAge: 60000 }
        );
      }

      function startCompose() {
        setEditingEntry(null);
        setDraftId(newId());
        setText(""); setLocation(""); setTags([]);
        setView("write");
        setTimeout(() => textRef.current?.focus(), 80);
      }

      function startEdit(entry) {
        setEditingEntry(entry);
        setDraftId(null);
        setText(entry.text);
        setLocation(entry.location || "");
        setTags(entry.tags || []);
        setView("write");
        setTimeout(() => textRef.current?.focus(), 80);
      }

      function cancelEdit() {
        setEditingEntry(null);
        setDraftId(null);
        setText(""); setLocation(""); setTags([]);
        setView("log");
      }

      async function addEntry() {
        if (!text.trim() || saving) return;
        setSaving(true);
        const payload = { text: text.trim(), location: location.trim(), tags };
        if (editingEntry) {
          const { data, error } = await db
            .from("entries").update(payload).eq("id", editingEntry.id)
            .select().single();
          if (!error && data) setEntries(prev => prev.map(e => e.id === data.id ? data : e));
          setEditingEntry(null);
        } else {
          const { data, error } = await db
            .from("entries")
            .insert({ ...payload, id: draftId || newId(), timestamp: new Date().toISOString() })
            .select().single();
          if (!error && data) {
            setEntries(prev => [data, ...prev]);
            setJustAdded(data.id);
            setTimeout(() => setJustAdded(null), 2000);
          }
        }
        setText(""); setLocation(""); setTags([]); setDraftId(null); setView("log"); setSaving(false);
      }

      // Two-step inline confirm rather than window.confirm — a system modal is
      // jarring in an app otherwise typeset this carefully.
      function requestDelete(id) {
        clearTimeout(confirmTimer.current);
        if (confirmDelete !== id) {
          setConfirmDelete(id);
          confirmTimer.current = setTimeout(() => setConfirmDelete(null), 3000);
          return;
        }
        setConfirmDelete(null);
        deleteEntry(id);
      }

      async function deleteEntry(id) {
        const { error } = await db.from("entries").delete().eq("id", id);
        if (!error) setEntries(prev => prev.filter(e => e.id !== id));
      }

      function filterByTag(tag) {
        setFilterTags(prev => prev.includes(tag) ? prev : [...prev, tag]);
        setFilterOpen(true);
        setView("log");
      }

      function renderText(value) {
        return highlightParts(value, filterText).map((part, i) =>
          typeof part === "string" ? part : <mark key={i}>{part.match}</mark>
        );
      }

      if (authLoading) return (
        <div style={{ minHeight: "100vh", background: "var(--ground)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontFamily: "var(--font-ui)", fontSize: 11, color: "var(--faint)", letterSpacing: "0.08em" }}>Loading...</span>
        </div>
      );
      if (!session) return <LoginScreen />;

      const grouped = groupByDate(filteredEntries);
      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
      const showLookback = !hasActiveFilters && lookBackCount > 0;

      const entriesTabLabel = entries.length === 0
        ? "Entries"
        : hasActiveFilters
          ? `Entries (${filteredEntries.length}/${entries.length})`
          : `Entries (${entries.length})`;

      return (
        <div className="app-wrap">
          <div className="sticky-nav">
            <div className="header">
              <div className="bar-inner">
                <span className="wordmark">Log</span>
                <div className="header-right">
                  <span className="live-clock">{formatTime(now)}</span>
                  <button className="text-btn" onClick={cycleTheme} title="Light, dark or follow the system">{theme}</button>
                  <button className="text-btn signout-btn" onClick={() => db.auth.signOut()}>sign out</button>
                </div>
              </div>
            </div>

            <div className="tab-bar">
              <div className="bar-inner">
                <button className={`tab ${view === "log" ? "active" : ""}`} onClick={() => setView("log")}>
                  {entriesTabLabel}
                </button>
                <button className={`tab ${view === "write" ? "active" : ""}`} onClick={startCompose}>
                  {editingEntry ? "Editing" : "+ New"}
                </button>
                <button className={`tab ${view === "calendar" ? "active" : ""}`} onClick={() => setView("calendar")}>
                  Calendar
                </button>
                <button
                  className={`search-toggle ${filterOpen ? "open" : ""}`}
                  onClick={() => setFilterOpen(f => !f)}
                >
                  Search
                  {hasActiveFilters && <span className="search-pip" />}
                </button>
              </div>
            </div>

            <div className={`filter-panel ${filterOpen ? "open" : ""}`}>
              <div className="filter-clip">
                <div className="filter-panel-inner">
                  <div className="filter-row full" style={{ marginBottom: 18 }}>
                    <div className="filter-field">
                      <span className="micro-label">Period</span>
                      <div className="chip-row" style={{ marginTop: 3 }}>
                        {[["today", "Today"], ["week", "This week"], ["month", "This month"], ["year", "This year"]].map(([kind, label]) => (
                          <button
                            key={kind}
                            className={`chip ${activePreset === kind ? "on" : ""}`}
                            onClick={() => applyPreset(kind)}
                          >
                            {label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className="filter-row">
                    <div className="filter-field">
                      <span className="micro-label">From</span>
                      <input
                        type="date"
                        className="field filter-input"
                        value={filterDateFrom}
                        max={filterDateTo || undefined}
                        onChange={e => setFilterDateFrom(e.target.value)}
                      />
                    </div>
                    <div className="filter-field">
                      <span className="micro-label">To</span>
                      <input
                        type="date"
                        className="field filter-input"
                        value={filterDateTo}
                        min={filterDateFrom || undefined}
                        onChange={e => setFilterDateTo(e.target.value)}
                      />
                    </div>
                  </div>
                  <div className="filter-row full">
                    <div className="filter-field">
                      <span className="micro-label">Content</span>
                      <input
                        type="text"
                        className="field filter-input"
                        placeholder="Search entries..."
                        value={filterText}
                        onChange={e => setFilterText(e.target.value)}
                      />
                    </div>
                  </div>
                  <div className="filter-row full">
                    <div className="filter-field">
                      <span className="micro-label">Location</span>
                      <input
                        type="text"
                        className="field filter-input"
                        placeholder="Search locations..."
                        value={filterLocation}
                        onChange={e => setFilterLocation(e.target.value)}
                      />
                    </div>
                  </div>
                  {allTags.length > 0 && (
                    <div className="filter-row full">
                      <div className="filter-field">
                        <span className="micro-label">Tags</span>
                        <div className="chip-row" style={{ marginTop: 3 }}>
                          {allTags.map(tag => (
                            <button
                              key={tag}
                              className={`chip ${filterTags.includes(tag) ? "on" : ""}`}
                              onClick={() => toggleFilterTag(tag)}
                            >
                              {tag}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                  <div className="filter-footer">
                    <span className="filter-summary">
                      {hasActiveFilters
                        ? `${filteredEntries.length} of ${entries.length} ${entries.length === 1 ? "entry" : "entries"}`
                        : `${entries.length} ${entries.length === 1 ? "entry" : "entries"}`}
                    </span>
                    <div className="filter-actions">
                      <button className="text-btn" onClick={() => exportEntries("markdown")}>export .md</button>
                      <span className="sep">·</span>
                      <button className="text-btn" onClick={() => exportEntries("json")}>.json</button>
                      {hasActiveFilters && <span className="sep">·</span>}
                      {hasActiveFilters && <button className="accent-btn" onClick={clearFilters}>clear all</button>}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {view === "write" && (
            <div
              className="write-band"
              style={composeColour ? { "--band": composeColour.bg, "--band-ink": composeColour.ink } : undefined}
            >
            <div className="write-panel">
              <div className="date-row">
                <span className="date-label">
                  {editingEntry
                    ? `Editing — ${formatDate(new Date(editingEntry.timestamp))}`
                    : formatDate(now)}
                </span>
                {composeColour && <span className="colour-note">{composeColour.name}</span>}
              </div>
              <textarea
                ref={textRef}
                className="textarea"
                value={text}
                onChange={e => setText(e.target.value)}
                placeholder="What's happening right now..."
                rows={6}
              />
              <div className="location-row">
                <input
                  className="field location-input"
                  value={location}
                  onChange={e => setLocation(e.target.value)}
                  placeholder="Location (optional)"
                />
                <button className="loc-btn" onClick={getLocation} disabled={locLoading}>
                  {locLoading ? "Locating..." : "Use GPS"}
                </button>
              </div>
              <TagInput tags={tags} setTags={setTags} suggestions={allTags} />
              <button className="solid-btn" onClick={addEntry} disabled={!text.trim() || saving}>
                {saving ? "Saving..." : editingEntry ? "Save changes" : "Log it"}
              </button>
              {editingEntry && (
                <button className="text-btn cancel-edit-btn" onClick={cancelEdit}>cancel</button>
              )}
            </div>
            </div>
          )}

          {view === "calendar" && (
            <div className="cal-panel" onTouchStart={onCalTouchStart} onTouchEnd={onCalTouchEnd}>
              <div className="cal-head">
                <span className="cal-title">{formatMonth(calMonth)}</span>
                <div className="cal-nav">
                  <button onClick={() => setCalMonth(m => addMonths(m, -1))} title="Previous month">‹</button>
                  <button onClick={() => setCalMonth(m => addMonths(m, 1))} title="Next month">›</button>
                </div>
              </div>
              <div className="cal-dow">
                {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => <span key={d}>{d}</span>)}
              </div>
              <div className="cal-grid">
                {calCells.map((date, i) => {
                  if (!date) return <span key={"blank" + i} className="cal-cell empty" />;
                  const dayEntries = byDay.get(date.toDateString()) || [];
                  const isToday = date.toDateString() === now.toDateString();
                  const isSelected = filterDateFrom === isoDay(date) && filterDateTo === isoDay(date);
                  return (
                    <button
                      key={date.toDateString()}
                      className={`cal-cell ${dayEntries.length ? "has" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}`}
                      onClick={() => dayEntries.length && openDay(date)}
                      disabled={!dayEntries.length}
                      title={dayEntries.length
                        ? `${formatDate(date)} — ${dayEntries.length} ${dayEntries.length === 1 ? "entry" : "entries"}`
                        : formatDate(date)}
                    >
                      <span className="cal-num">{date.getDate()}</span>
                      <span className="cal-swatch">
                        {dayEntries.map(entry => {
                          const c = postColours.get(entry.id);
                          return <span key={entry.id} className="cal-stripe"
                            style={{ background: c ? c.bg : "transparent" }} />;
                        })}
                      </span>
                    </button>
                  );
                })}
              </div>
              <div className="cal-foot">
                <span>{calMonthCount} {calMonthCount === 1 ? "entry" : "entries"} this month</span>
                <span>Tap a day to open it</span>
              </div>
            </div>
          )}

          {view === "log" && (
            <div className="log-panel">
              {showLookback && (
                <div className={`lookback ${lookbackOpen ? "lookback-open" : ""}`}>
                  <button className="lookback-toggle" onClick={() => setLookbackOpen(o => !o)}>
                    <span>Looking back</span>
                    <span>{lookBackCount} {lookBackCount === 1 ? "entry" : "entries"} {lookbackOpen ? "−" : "+"}</span>
                  </button>
                  {lookbackOpen && lookBack.map(group => (
                    <div key={group.monthsAgo} className="lookback-group">
                      <div className="lookback-label">{group.label}</div>
                      {group.entries.map(entry => (
                        <div key={entry.id} className="lookback-entry">
                          <span className="lookback-date">{formatShortDate(new Date(entry.timestamp))}</span>
                          <span className="lookback-text">{entry.text}</span>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}

              {loading ? (
                <div className="empty-state">Loading entries...</div>
              ) : filteredEntries.length === 0 ? (
                <div className="empty-state">
                  {hasActiveFilters
                    ? <>No entries match your filters.<br /><span style={{ fontSize: 13 }}>Adjust or clear to see more.</span></>
                    : <>Nothing logged yet.<br />Tap <em>+ New</em> to record your first entry.</>
                  }
                </div>
              ) : (
                sortedDates.map(dateKey => (
                  <div key={dateKey} className="day-group">
                    <div className="day-header">
                      <span className="day-title">{formatDate(new Date(dateKey))}</span>
                      <span className="day-count">{grouped[dateKey].length} {grouped[dateKey].length === 1 ? "entry" : "entries"}</span>
                    </div>
                    {grouped[dateKey].map(entry => {
                      const colour = postColours.get(entry.id) || { bg: "var(--quiet)", ink: "var(--ink)" };
                      return (
                      <div
                        key={entry.id}
                        className={`post ${justAdded === entry.id ? "new" : ""}`}
                        style={{ "--band": colour.bg, "--band-ink": colour.ink }}
                        title={colour.name}
                      >
                        <div className="post-time">{formatTime(new Date(entry.timestamp))}</div>
                        <div className="post-text">{renderText(entry.text)}</div>
                        <div className="post-meta">
                          {entry.location && <span className="post-loc">{entry.location}</span>}
                          {(entry.tags || []).map(tag => (
                            <button key={tag} className="post-tag" onClick={() => filterByTag(tag)}>#{tag}</button>
                          ))}
                          <div className="post-actions">
                            <button className="icon-btn edit-btn" onClick={() => startEdit(entry)} title="Edit">✎</button>
                            <button
                              className={`icon-btn delete-btn ${confirmDelete === entry.id ? "confirming" : ""}`}
                              onClick={() => requestDelete(entry.id)}
                              title={confirmDelete === entry.id ? "Tap again to delete" : "Delete"}
                            >
                              {confirmDelete === entry.id ? "sure?" : "×"}
                            </button>
                          </div>
                        </div>
                      </div>
                      );
                    })}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
